<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trapsoul Researcher</title><style>body{margin:0;background:#09090b;color:#f4f4f5;font:15px system-ui}main{max-width:1100px;margin:auto;padding:36px 20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:#111114;border:1px solid #27272a;border-radius:18px;padding:20px}input,select,button{padding:11px;border-radius:9px;border:1px solid #3f3f46;background:#18181b;color:#fff}input{width:95%;margin:7px 0 12px}button{cursor:pointer}.row{display:flex;gap:10px}pre{white-space:pre-wrap}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main><h1>Trapsoul Researcher</h1><p>Hip Hop · R&B · Trap Soul — research, ideation & SEO</p><div class="grid"><section class="card"><h2>Live Research</h2><select id="genre"><option>R&B</option><option>Hip Hop</option><option>Trap Soul</option></select><input id="market" value="US" placeholder="Market"><input id="seed" placeholder="late night, heartbreak, summer"><button onclick="research()">Research</button></section><section class="card"><h2>Creative Lab</h2><input id="title" value="After Hours"><div class="row"><button onclick="titles()">Titles</button><button onclick="concept()">Lyric concept</button><button onclick="seo()">SEO</button></div></section></div><section class="card" style="margin-top:18px"><pre id="out">Ready.</pre></section></main><script>const out=x=>document.querySelector('#out').textContent=JSON.stringify(x,null,2);const post=async(u,b)=>(await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)})).json();async function research(){out(await post('/api/research',{genre:genre.value,market:market.value,seed:seed.value,days:30,limit:20}))}async function titles(){out(await post('/api/titles',{genre:genre.value,mood:'late night',themes:['love','pressure'],count:25}))}async function concept(){out(await post('/api/lyrics/concept',{title:title.value,genre:genre.value,mood:'dark romantic',themes:['love','heartbreak']}))}async function seo(){out(await post('/api/seo',{title:title.value,genre:genre.value,market:market.value,themes:['love','late night'],platform:'YouTube'}))}</script></body></html>
